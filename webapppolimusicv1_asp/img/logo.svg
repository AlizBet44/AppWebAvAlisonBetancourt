<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="poliPurplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon: Soft Pink & Purple Soundwaves on Light Pearl Base -->
  <g transform="translate(10, 8)">
    <circle cx="22" cy="22" r="21" fill="#fff0f5" stroke="url(#poliPurplePinkGrad)" stroke-width="2.5" />
    <!-- Audio Wave Bars -->
    <rect x="10" y="16" width="3.5" height="12" rx="1.75" fill="url(#waveGrad)" />
    <rect x="16" y="11" width="3.5" height="22" rx="1.75" fill="url(#poliPurplePinkGrad)" filter="url(#glow)" />
    <rect x="22" y="7" width="3.5" height="30" rx="1.75" fill="#ec4899" filter="url(#glow)" />
    <rect x="28" y="12" width="3.5" height="20" rx="1.75" fill="url(#poliPurplePinkGrad)" />
    <rect x="34" y="17" width="3.5" height="10" rx="1.75" fill="url(#waveGrad)" />
  </g>

  <!-- Logo Brand Text: Dark Plum Text + Hot Pink Music -->
  <text x="66" y="38" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#180b26" letter-spacing="-0.5">
    Poli<tspan fill="#ec4899">Music</tspan>
  </text>
  <circle cx="205" cy="24" r="3.5" fill="#ec4899" filter="url(#glow)" />
</svg>
